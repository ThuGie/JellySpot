<div id="jellyspotBrowsePage" data-role="page" class="page libraryPage jellyspot-page fullWidthContent" data-controller="__plugin/JellySpotBrowseJs" data-title="JellySpot Browse">
  <div class="content-primary">
    <div class="verticalSection">
      <h2 class="sectionTitle">Browse Spotify</h2>
      <p>Search Spotify or open your playlists, then queue downloads.</p>
      <div class="jellyspot-row" style="margin-bottom:1rem;">
        <input is="emby-input" id="jellyspotSearchInput" type="text" placeholder="Search tracks, albums, playlists" style="flex:1;" />
        <button is="emby-button" type="button" class="raised button-submit" id="jellyspotSearchBtn"><span>Search</span></button>
        <button is="emby-button" type="button" class="raised" id="jellyspotLoadPlaylistsBtn"><span>My Playlists</span></button>
        <button is="emby-button" type="button" class="raised" id="jellyspotLikedBtn"><span>Liked Songs</span></button>
      </div>
      <div id="jellyspotBrowseStatus" class="fieldDescription"></div>
      <div id="jellyspotBrowseResults" class="jellyspot-grid"></div>
    </div>
  </div>
</div>
