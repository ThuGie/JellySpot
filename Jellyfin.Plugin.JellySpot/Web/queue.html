<div id="jellyspotQueuePage" data-role="page" class="page libraryPage jellyspot-page fullWidthContent" data-controller="__plugin/JellySpotQueueJs" data-title="JellySpot Queue">
  <div class="content-primary">
    <div class="verticalSection">
      <h2 class="sectionTitle">Download Queue</h2>
      <p>Track matching scores, failures, and rematch actions.</p>
      <div class="jellyspot-row" style="margin:0.75rem 0;">
        <select is="emby-select" id="jellyspotQueueFilter">
          <option value="">All</option>
          <option value="Pending">Pending</option>
          <option value="Matching">Matching</option>
          <option value="Downloading">Downloading</option>
          <option value="Completed">Completed</option>
          <option value="Failed">Failed</option>
        </select>
        <button is="emby-button" type="button" class="raised" id="jellyspotQueueRefresh"><span>Refresh</span></button>
      </div>
      <table class="jellyspot-table" id="jellyspotQueueTable">
        <thead>
          <tr>
            <th>Track</th>
            <th>Status</th>
            <th>Score</th>
            <th>Error</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>
</div>
