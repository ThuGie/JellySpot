<div id="jellySpotQueuePage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-button,emby-select">
    <div data-role="content">
        <div class="content-primary">
            <div class="sectionTitleContainer">
                <h2 class="sectionTitle">JellySpot Queue</h2>
            </div>
            <p>Download progress, match scores, and rematch actions.</p>

            <div style="display:flex;gap:.5em;flex-wrap:wrap;margin:1em 0;align-items:center;">
                <div class="selectContainer" style="margin:0;">
                    <label class="selectLabel" for="jellyspotQueueFilter">Status</label>
                    <select is="emby-select" id="jellyspotQueueFilter" class="emby-select-withcolor">
                        <option value="">All</option>
                        <option value="Pending">Pending</option>
                        <option value="Matching">Matching</option>
                        <option value="Downloading">Downloading</option>
                        <option value="Completed">Completed</option>
                        <option value="Failed">Failed</option>
                    </select>
                </div>
                <button is="emby-button" type="button" class="raised" id="jellyspotQueueRefresh"><span>Refresh</span></button>
            </div>

            <table class="detailTable" style="width:100%;">
                <thead>
                    <tr>
                        <th>Track</th>
                        <th>Status</th>
                        <th>Score</th>
                        <th>Details</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="jellyspotQueueBody"></tbody>
            </table>
        </div>
    </div>
    <script>
        (function () {
            var page = document.getElementById('jellySpotQueuePage');

            function pick(obj) {
                if (!obj) return undefined;
                for (var i = 1; i < arguments.length; i++) {
                    if (obj[arguments[i]] !== undefined) return obj[arguments[i]];
                }
                return undefined;
            }

            function load() {
                var status = page.querySelector('#jellyspotQueueFilter').value;
                var url = ApiClient.getUrl('JellySpot/Queue') + (status ? ('?status=' + encodeURIComponent(status)) : '');
                Dashboard.showLoadingMsg();
                ApiClient.ajax({ type: 'GET', url: url, dataType: 'json' }).then(function (items) {
                    var tbody = page.querySelector('#jellyspotQueueBody');
                    tbody.innerHTML = '';
                    (items || []).forEach(function (item) {
                        var tr = document.createElement('tr');
                        var title = pick(item, 'Title', 'title') || '';
                        var artists = pick(item, 'Artists', 'artists') || '';
                        var st = pick(item, 'Status', 'status') || '';
                        var score = pick(item, 'MatchScore', 'matchScore');
                        var detail = pick(item, 'Error', 'error') || pick(item, 'YoutubeVideoId', 'youtubeVideoId') || '';
                        var id = pick(item, 'Id', 'id');
                        tr.innerHTML =
                            '<td><strong>' + title + '</strong><div class="fieldDescription">' + artists + '</div></td>' +
                            '<td>' + st + '</td>' +
                            '<td>' + (score != null ? Number(score).toFixed(1) : '-') + '</td>' +
                            '<td>' + detail + '</td>' +
                            '<td></td>';
                        if (st === 'Failed' || st === 'Completed') {
                            var btn = document.createElement('button');
                            btn.setAttribute('is', 'emby-button');
                            btn.className = 'raised';
                            btn.type = 'button';
                            btn.innerHTML = '<span>Rematch</span>';
                            btn.addEventListener('click', function () {
                                ApiClient.ajax({
                                    type: 'POST',
                                    url: ApiClient.getUrl('JellySpot/Queue/' + id + '/Rematch')
                                }).then(load);
                            });
                            tr.children[4].appendChild(btn);
                        }
                        tbody.appendChild(tr);
                    });
                    Dashboard.hideLoadingMsg();
                }).catch(function () {
                    Dashboard.hideLoadingMsg();
                    Dashboard.alert('Could not load queue');
                });
            }

            page.querySelector('#jellyspotQueueRefresh').addEventListener('click', load);
            page.querySelector('#jellyspotQueueFilter').addEventListener('change', load);
            page.addEventListener('pageshow', load);
        })();
    </script>
</div>
