name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.JellySpot/Jellyfin.Plugin.JellySpot.csproj

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellySpot/Jellyfin.Plugin.JellySpot.csproj -c Release --no-restore

      - name: Package zip
        run: bash scripts/package.sh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellySpot-plugin
          path: artifacts/*.zip
