name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore JellySpot.sln

      - name: Build
        run: dotnet build Jellyfin.Plugin.JellySpot/Jellyfin.Plugin.JellySpot.csproj -c Release --no-restore

      - name: Backend regression tests
        run: dotnet test JellySpot.sln -c Release --no-restore

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: UI regression tests
        run: |
          npm ci --prefix Jellyfin.Plugin.JellySpot.Tests
          node Jellyfin.Plugin.JellySpot.Tests/node_modules/@playwright/test/cli.js install --with-deps chromium
          npm test --prefix Jellyfin.Plugin.JellySpot.Tests

      - name: Browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: JellySpot-browser-review
          path: artifacts/browser-review/*.png
          if-no-files-found: ignore

      - name: Package zip
        run: bash scripts/package.sh artifacts

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: JellySpot-plugin
          path: artifacts/*.zip
